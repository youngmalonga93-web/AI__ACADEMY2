<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">AI Marketing and Sales animated SVG</title>
<desc id="desc">Lightweight animated educational SaaS scene for AI Academy module 7: AI Marketing and Sales.</desc>
<style>
:root { --accent: #22C55E; --bg:#0b1020; --panel:#172033; --line:#7c8aa5; --good:#35d6a6; --soft:#bfd7ff; }
.bg { fill: var(--bg); } .grid { stroke:#26324d; stroke-width:1; opacity:.35; }
.panel { fill:var(--panel); stroke:#344461; stroke-width:2; opacity:.92; }
.glow { filter:url(#glow); } .titlebar { fill:var(--accent); opacity:.23; }
.card rect { fill:#111a2e; stroke:var(--soft); stroke-width:2; opacity:.9; } .card circle { fill:var(--accent); opacity:.9; } .card path { stroke:#dce8ff; stroke-width:6; stroke-linecap:round; opacity:.75; }
.card { animation: float 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; } .c1{animation-delay:.25s} .c2{animation-delay:.5s} .c3{animation-delay:.75s} .c4{animation-delay:1s}
.node { fill:var(--accent); opacity:.85; animation:pulse 1.8s ease-in-out infinite; } .n1{animation-delay:.25s} .n2{animation-delay:.5s} .n3{animation-delay:.75s} .n4{animation-delay:1s}
.link { stroke:var(--line); stroke-width:4; stroke-linecap:round; opacity:.65; }
.particle { fill:#fff; opacity:0; animation: flow 3.2s linear infinite; } .p1{animation-delay:.45s} .p2{animation-delay:.9s} .p3{animation-delay:1.35s} .p4{animation-delay:1.8s} .p5{animation-delay:2.25s}
.bar { fill:var(--good); transform-origin:bottom; animation: grow 2.4s ease-in-out infinite; opacity:.88; } .b1{animation-delay:.2s} .b2{animation-delay:.4s} .b3{animation-delay:.6s} .b4{animation-delay:.8s}
.scan { stroke:var(--good); stroke-width:4; stroke-linecap:round; animation: scan 2.8s ease-in-out infinite; opacity:.9; }
.orbit { fill:none; stroke:var(--soft); stroke-width:3; stroke-dasharray:10 12; animation: dash 8s linear infinite; opacity:.55; }
.smalltext { font: 700 24px system-ui,Segoe UI,sans-serif; fill:#eaf2ff; letter-spacing:.03em; } .num { font: 800 72px system-ui,Segoe UI,sans-serif; fill:#fff; opacity:.12; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
@keyframes pulse { 0%,100%{r:18;opacity:.65} 50%{r:24;opacity:1} }
@keyframes flow { 0%{transform:translate(0,0);opacity:0} 15%{opacity:1} 85%{opacity:1} 100%{transform:translate(760px,155px);opacity:0} }
@keyframes grow { 0%,100%{transform:scaleY(.45)} 50%{transform:scaleY(1)} }
@keyframes scan { 0%,100%{transform:translateX(0);opacity:.25} 50%{transform:translateX(310px);opacity:1} }
@keyframes dash { to{stroke-dashoffset:-220} }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
